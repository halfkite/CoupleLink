name: couplelink
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: couplelink
      POSTGRES_DB: couplelink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couplelink -d couplelink"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ../server
    environment:
      DATABASE_URL: postgresql://couplelink:${POSTGRES_PASSWORD}@db:5432/couplelink?sslmode=disable
      COUPLELINK_ALLOWED_ORIGINS: ${COUPLELINK_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${COUPLELINK_BIND_IP:-127.0.0.1}:${COUPLELINK_PORT:-18080}:8080"
    restart: unless-stopped
  https:
    image: caddy:2
    profiles: ["https"]
    environment:
      COUPLELINK_DOMAIN: ${COUPLELINK_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
volumes:
  database:
  caddy_data:
  caddy_config:
