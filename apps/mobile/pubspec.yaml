name: couplelink
description: "CoupleLink private couple space UI preview"
publish_to: 'none'
version: 1.0.0-r9+9

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  shared_preferences: 2.5.6
  http: 1.6.0
  flutter_secure_storage: 11.2.0
  drift: 2.35.1
  drift_flutter: 0.3.1
  centrifuge: 0.21.0
  flutter_local_notifications: 22.3.3
  flutter_foreground_task: 11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/locales/
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
