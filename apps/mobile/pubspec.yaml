name: couplelink
description: "CoupleLink private couple space UI preview"
publish_to: 'none'
version: 1.0.0-r3+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  shared_preferences: 2.5.6
  http: 1.6.0
  flutter_secure_storage: 11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/locales/
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
